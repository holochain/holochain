[package]
name = "holochain_cli"
version = "0.8.0-dev.5"
repository = "https://github.com/holochain/holochain"
documentation = "https://docs.rs/holochain_cli"
authors = ["Holochain Core Dev Team <devcore@holochain.org>"]
keywords = ["holochain", "holo"]
categories = [
  "command-line-utilities",
  "development-tools::build-utils",
  "filesystem",
]
edition = "2021"
license = "Apache-2.0"
description = "Provides the `hc` binary, a helpful CLI tool for working with Holochain."

[[bin]]
name = "hc"
path = "src/bin/hc.rs"

[lib]
name = "holochain_cli"
path = "src/lib.rs"

[[test]]
name = "export_ts_bindings_tests"
path = "tests/export_ts_bindings_tests.rs"
required-features = ["ts_rs"]

# reminder - do not use workspace deps
[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive", "cargo"] }
lazy_static = "1.4"
holochain_cli_bundle = { path = "../hc_bundle", version = "^0.8.0-dev.5", default-features = false }
holochain_cli_sandbox = { path = "../hc_sandbox", version = "^0.8.0-dev.5", default-features = false }
holochain_cli_client = { path = "../hc_client", version = "^0.8.0-dev.5", default-features = false }
holochain_conductor_api = { version = "^0.8.0-dev.5", path = "../holochain_conductor_api", default-features = false }
holochain_trace = { version = "^0.8.0-dev.0", path = "../holochain_trace" }
tokio = { version = "1.36.0", features = ["full"] }
ts-rs = { version = "12.0", optional = true }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.0"

[lints]
workspace = true

[features]

default = ["wasmer-sys-cranelift"]

# Enables the `hc export-ts-bindings` subcommand. Off by default: a workspace
# build would otherwise unify `ts_rs` into every crate that depends on
# `holochain_cli`, forcing them to compile the `ts_rs`-gated code in the type
# crates too. Enabled by `make ts-bindings` / `make ts-bindings-test`.
ts_rs = ["dep:ts-rs", "holochain_conductor_api/ts_rs"]

# Includes the countersigning app API in the `hc export-ts-bindings` output.
# Implies `ts_rs`. Not on by default: a workspace build would unify it into
# `holochain`'s `holochain_conductor_api` while `holochain`'s own matching
# feature is off, and its exhaustive match on `AppRequest` would no longer
# compile.
unstable-countersigning = [
  "ts_rs",
  "holochain_conductor_api/unstable-countersigning",
]

wasmer-sys-cranelift = [
  "holochain_cli_sandbox/wasmer-sys-cranelift",
  "holochain_cli_client/wasmer-sys-cranelift",
]
wasmer-wasmi = [
  "holochain_cli_sandbox/wasmer-wasmi",
  "holochain_cli_client/wasmer-wasmi",
]
