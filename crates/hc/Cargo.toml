[package]
name = "holochain_cli"
version = "0.8.0-dev.2"
repository = "https://github.com/holochain/holochain"
documentation = "https://docs.rs/holochain_cli"
authors = ["Holochain Core Dev Team <devcore@holochain.org>"]
keywords = ["holochain", "holo"]
categories = [
  "command-line-utilities",
  "development-tools::build-utils",
  "filesystem",
]
edition = "2021"
license = "Apache-2.0"
description = "Provides the `hc` binary, a helpful CLI tool for working with Holochain."

[[bin]]
name = "hc"
path = "src/bin/hc.rs"

[lib]
name = "holochain_cli"
path = "src/lib.rs"

# reminder - do not use workspace deps
[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive", "cargo"] }
lazy_static = "1.4"
holochain_cli_bundle = { path = "../hc_bundle", version = "^0.8.0-dev.2", default-features = false }
holochain_cli_sandbox = { path = "../hc_sandbox", version = "^0.8.0-dev.2", default-features = false }
holochain_cli_client = { path = "../hc_client", version = "^0.8.0-dev.2", default-features = false }
# `ts_rs` is always on: `hc export-ts-bindings` is a built-in subcommand.
holochain_conductor_api = { version = "^0.8.0-dev.2", path = "../holochain_conductor_api", default-features = false, features = [
  "ts_rs",
] }
holochain_trace = { version = "^0.8.0-dev.0", path = "../holochain_trace" }
tempfile = "3.0"
tokio = { version = "1.36.0", features = ["full"] }
ts-rs = "12.0"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"

[lints]
workspace = true

[features]

default = ["wasmer-sys-cranelift"]

wasmer-sys-cranelift = [
  "holochain_cli_sandbox/wasmer-sys-cranelift",
  "holochain_cli_client/wasmer-sys-cranelift",
]
wasmer-wasmi = [
  "holochain_cli_sandbox/wasmer-wasmi",
  "holochain_cli_client/wasmer-wasmi",
]

# Includes the countersigning app API in the `hc export-ts-bindings` output.
# Not on by default: a workspace build would unify it into `holochain`'s
# `holochain_conductor_api` while `holochain`'s own matching feature is off,
# and its exhaustive match on `AppRequest` would no longer compile.
unstable-countersigning = ["holochain_conductor_api/unstable-countersigning"]
