[package]
name = "test_wasm_agent_info"
version = "0.0.1"
authors = ["thedavidmeister", "thedavidmeister@gmail.com"]
edition = "2021"
publish = false

[lib]
name = "test_wasm_agent_info"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "integrity_test_wasm_agent_info"
path = "src/integrity.rs"
crate-type = ["cdylib", "rlib"]

# reminder - do not use workspace deps
[dependencies]
hdk = { version = "0.9.0-dev.1", optional = true }
serde = "1.0"
holochain_serialized_bytes = "0.0.57"
hdi = { version = "=0.9.0-dev.4" }

[dev-dependencies]
hdk = { version = "0.9.0-dev.1", features = ["fixturators"] }
fixt = { version = "=0.9.0-dev.4" }

[features]
default = ["hdk"]
integrity = []
mock = ["hdk/mock"]
