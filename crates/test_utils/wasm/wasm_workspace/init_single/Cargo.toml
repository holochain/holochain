[package]
name = "test_wasm_init_single"
description = "Wasm that will error if init is called more than once"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "test_wasm_init_single"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "integrity_test_wasm_init_single"
path = "src/integrity.rs"
crate-type = ["cdylib", "rlib"]

# reminder - do not use workspace deps
[dependencies]
serde = "1.0"
holochain_serialized_bytes = "0.0.57"
hdi = { version = "=0.9.0-dev.4" }
hdk = { version = "=0.9.0-dev.0" }

[features]
default = []
