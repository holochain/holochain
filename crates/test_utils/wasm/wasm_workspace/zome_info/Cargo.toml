[package]
name = "test_wasm_zome_info"
version = "0.0.1"
authors = ["thedavidmeister", "thedavidmeister@gmail.com"]
edition = "2021"
publish = false

[lib]
name = "test_wasm_zome_info"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "integrity_test_wasm_zome_info"
path = "src/integrity.rs"
crate-type = ["cdylib", "rlib"]

# reminder - do not use workspace deps
[dependencies]
hdk = { version = "=0.9.0-dev.0", features = ["properties"] }
serde = "1.0"
holochain_serialized_bytes = "0.0.57"
yaml_serde = "0.10"
hdi = { version = "=0.9.0-dev.4" }

[dev-dependencies]
hdk = { version = "=0.9.0-dev.0", features = ["fixturators", "properties"] }
fixt = { version = "=0.9.0-dev.4" }

[features]
default = []
mock = ["hdk/mock"]
