[package]
name = "test_wasm_crd"
version = "0.0.1"
authors = ["thedavidmeister", "thedavidmeister@gmail.com"]
edition = "2021"
publish = false

[lib]
name = "test_wasm_crd"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "integrity_test_wasm_crd"
path = "src/integrity.rs"
crate-type = ["cdylib", "rlib"]

# reminder - do not use workspace deps
[dependencies]
serde = "1.0"
holochain_serialized_bytes = "0.0.57"
holochain_test_wasm_common = { path = "../../../wasm_common" }
hdk = { version = "=0.9.0-dev.0", optional = true }
hdi = { version = "=0.9.0-dev.4" }

[features]
default = ["hdk"]
integrity = []
mock = ["hdk/mock"]

[dev-dependencies]
fixt = { version = "=0.9.0-dev.4" }
hdk = { version = "=0.9.0-dev.0", features = ["fixturators"] }
