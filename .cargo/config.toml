# ts-rs export configuration (issue #5930). Read at export time only;
# no effect on ordinary builds.
[env]
# The conductor clients use plain `number` for 64-bit integers
# (timestamps, counters), not `bigint`.
TS_RS_LARGE_INT = "number"
# holochain-client-js is an ES module package with NodeNext resolution:
# import paths must carry a `.js` extension.
TS_RS_IMPORT_EXTENSION = "js"
